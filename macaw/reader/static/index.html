<!doctype html>

<body>

    <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 6.5h16M9.5 6.5V4.3c0-.6.4-1 1-1h3c.6 0 1 .4 1 1v2.2M6.2 6.5l.9 13.3c.1 1 .9 1.7 1.9 1.7h6c1 0 1.8-.7 1.9-1.7l.9-13.3"/></symbol>

    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M7 4v16m0 0-3.5-3.5M7 20l3.5-3.5M17 20V4m0 0-3.5 3.5M17 4l3.5 3.5"/></symbol>

</svg>

<div id="app">
  <!-- Home -->
  <section class="tab" id="tab-home" hidden>
    <header class="big-head"><h1>Home</h1></header>
    <div id="home-body"></div>
  </section>

  <!-- Library -->
  <section class="tab" id="tab-library">
    <header class="big-head">
      <h1>Library</h1>
      <div class="head-btns">
        <button class="glass round" id="btn-add" aria-label="Add a book"><svg><use href="#i-plus"/></svg></button>
        <button class="glass round" id="btn-view" aria-label="Change view"><svg><use href="#i-lines"/></svg></button>
        <button class="glass round" id="btn-libmore" aria-label="More"><svg><use href="#i-more"/></svg></button>
      </div>
    </header>
    <div id="shelf" class="grid"></div>
  </section>

  <!-- Search -->
  <section class="tab" id="tab-search" hidden>
    <header class="big-head"><h1>Search</h1></header>
    <label class="search-field"><svg><use href="#i-search"/></svg><input id="lib-q" type="search" placeholder="Your Library" autocomplete="off"></label>
    <div id="lib-results"></div>
  </section>

  <nav id="tabbar" class="glass">
    <button data-tab="home"><svg><use href="#i-home"/></svg><span>Home</span></button>
    <button data-tab="library" class="on"><svg><use href="#i-library"/></svg><span>Library</span></button>
    <button data-tab="search"><svg><use href="#i-search"/></svg><span>Search</span></button>
  </nav>
</div>

<!-- Reader -->
<div id="reader" hidden>
  <div id="viewport"><div id="flow"></div></div>
  <div class="pill" id="title-pill"></div>
  <button class="glass round chrome" id="btn-close" aria-label="Close"><svg><use href="#i-x"/></svg></button>
  <div class="pill" id="page-pill"></div>
  <button class="glass round chrome" id="btn-menu" aria-label="Reading menu"><svg><use href="#i-menu"/></svg></button>
  <div id="spinner" hidden><div class="spin"></div></div>

  <div id="rmenu" hidden>
    <div class="rmenu-wrap">
    <div class="rmenu-stack">
      <button class="glass wide" id="m-contents"><span>Contents</span><svg><use href="#i-toc"/></svg></button>
      <button class="glass wide" id="m-search"><span>Search Book</span><svg><use href="#i-search"/></svg></button>
      <button class="glass wide" id="m-themes"><span>Themes &amp; Settings</span><svg class="aa"><use href="#i-aa"/></svg></button>
      <div class="rmenu-row">
        <button class="glass round" id="m-share" aria-label="Share"><svg><use href="#i-share"/></svg></button>
        <button class="glass round" id="m-rotate" aria-label="Lock rotation"><svg><use href="#i-rotate"/></svg></button>
        <button class="glass round" id="m-scroll" aria-label="Scrolling view"><svg><use href="#i-scroll"/></svg></button>
        <button class="glass round" id="m-bookmark" aria-label="Bookmark"><svg><use href="#i-bookmark"/></svg></button>
      </div>
    </div>
    <div class="glass" id="scrubber"><div id="scrub-thumb"></div><div id="scrub-tip" hidden></div></div>
    </div>
  </div>
</div>

<div id="layer"></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept=".epub,.fb2,.txt,.zip,application/epub+zip,text/plain" multiple hidden>
<script src="static/app.js"></script>
</body>
</html>
